name: Build & Release APK

# APK 배포 자동화 워크플로우
# - 태그 푸시(v1.3.1 등) 또는 수동 실행(workflow_dispatch) 시
#   Android 앱을 빌드해 GitHub Release에 app-release.apk로 첨부 (고정 자산명 → 앱 내 업데이트 URL 안정)
# - 배포 링크: https://github.com/davidhunchoi/todak-todak/releases/latest/download/app-release.apk
# - 서명 고정: GitHub Secrets에 ANDROID_KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD 등록 필수
#   (매번 바뀌는 debug 키로 빌드하면 기존 설치와 서명 충돌 → "설치 안 됨")

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 태그 (예: v1.2.0) — 비우면 현재 브랜치로 릴리스'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # ubuntu-latest 이미지에는 Android SDK가 이미 포함되어 있음
          # 추가 Build Tools 34.0.0이 없을 경우 sdkmanager로 설치
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "Android SDK Location: $ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools/" || true
          if [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "Installing Build Tools 34.0.0 via sdkmanager..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              --sdk_root="$ANDROID_HOME" || \
            yes | "$ANDROID_HOME/tools/bin/sdkmanager" \
              "platforms;android-34" \
              "build-tools;34.0.0" \
              --sdk_root="$ANDROID_HOME" || true
          else
            echo "Build Tools 34.0.0 already installed."
          fi
          echo "PATH=${ANDROID_HOME}/build-tools/34.0.0:${PATH}" >> $GITHUB_ENV

      - name: Enable Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle.lockfile') }}
          restore-keys: |
            gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Restore release keystore (same key every build)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret이 없습니다. debug 키로 빌드하면 기존 설치와 서명이 충돌해 '앱이 설치되지 않았습니다'가 발생하므로 배포를 중단합니다."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "keystore restored"

      - name: Build Release APK (signed with fixed key)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Gradle JVM 메모리 증가 (OOM 방지)
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
        run: |
          set -o pipefail
          # release 키가 반드시 있어야 하므로 항상 assembleRelease 로 빌드한다.
          # (keystore 없이 assembleDebug 로 폴백하면 debug 서명 APK 가 app-release.apk 이름으로 올라가
          #  기존 설치와 서명 충돌 → "설치 안 됨" 사고가 재발한다)
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Report Build Error Log
        if: failure()
        run: |
          echo "### ❌ Gradle Build Error Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          # 1. Kotlin 컴파일 에러만 먼저 추출 (가장 중요한 원인)
          echo "=== KOTLIN COMPILE ERRORS ===" >> $GITHUB_STEP_SUMMARY
          grep -n "error:\|Unresolved reference\|None of the following\|Cannot access\|not found\|Type mismatch\|Overload resolution ambiguity\|Val cannot be reassigned" build.log | head -n 50 >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "=== GRADLE FAILURE SUMMARY ===" >> $GITHUB_STEP_SUMMARY
          grep -n "FAILURE\|BUILD FAILED\|Caused by:\|> Task\|> Could not" build.log | tail -n 30 >> $GITHUB_STEP_SUMMARY || true
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "=== LAST 300 LINES ===" >> $GITHUB_STEP_SUMMARY
          tail -n 300 build.log >> $GITHUB_STEP_SUMMARY || echo "(build.log 없음)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify artifact
        run: |
          ls -lh app-release.apk
          # 서명 검증: release 키로 서명되었는지 확인 (실패 시 배포 중단)
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs app-release.apk
          else
            echo "::warning::apksigner 를 찾지 못해 서명 검증을 건너뜁니다."
          fi

      - name: Compute release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "release_tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.release_tag }}
          APK: app-release.apk
        run: |
          gh release create "$TAG" "$APK#app-release.apk" \
            --title "$TAG" \
            --notes "토닥토닥 자동 빌드 릴리스" \
            --generate-notes \
            --latest || \
            gh release upload "$TAG" "$APK#app-release.apk" --clobber