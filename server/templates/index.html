<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>토닥토닥 우리가족 챙기기 🌸</title>

  <!-- PWA & iOS 설정 -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FF6B6B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="토닥토닥">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">

  <!-- 스타일시트 -->
  <link rel="stylesheet" href="/static/css/todak-mobile.css">
</head>
<body>
  <div id="app-container">
    <!-- iOS 사파리 홈 화면 추가 안내 배너 -->
    <div id="ios-banner" class="ios-pwa-banner" style="display: none;">
      <div class="banner-text">
        <span>📲 사파리 하단 <b>[공유]</b> → <b>[홈 화면에 추가]</b>를 누르면 앱처럼 쓸 수 있어요!</span>
      </div>
      <button id="btn-close-banner" class="close-banner">✕</button>
    </div>

    <!-- 1. 온보딩 / 방 입장 뷰 -->
    <div id="view-join" class="view-join" style="display: none;">
      <img src="/static/icons/icon-192.png" alt="토닥토닥" class="join-hero-img">
      <h1 class="join-title">토닥토닥</h1>
      <p class="join-desc">소중한 가족과 함께하는<br>따뜻한 할 일 및 루틴 챙김 공간 🌸</p>

      <div class="join-card">
        <div class="input-group">
          <label>내 이름 (별명)</label>
          <input type="text" id="input-join-name" class="input-field" placeholder="예: 딸내미, 아들, 지민이" maxlength="10">
        </div>

        <div class="input-group">
          <label>아빠가 알려준 4자리 초대 코드</label>
          <input type="tel" id="input-join-code" class="input-field input-code" placeholder="0000" maxlength="4">
        </div>

        <button id="btn-submit-join" class="btn-primary">우리 가족 방 들어가기 💕</button>
        <button id="btn-create-new-space" class="btn-secondary">+ 새로운 가족 공간 만들기</button>
      </div>
    </div>

    <!-- 2. 메인 방 뷰 -->
    <div id="view-main" style="display: none;">
      <!-- 헤더 -->
      <header>
        <div class="header-brand">
          <img src="/static/icons/icon-192.png" alt="토닥토닥" class="header-logo">
          <div class="header-title-wrap">
            <div class="header-space-title">
              <span id="header-space-title">우리 가족 방</span>
              <span>🌸</span>
            </div>
            <div id="header-user-badge" class="header-user-badge">자녀 님</div>
          </div>
        </div>
        <button id="btn-change-space" class="header-btn">방 나가기</button>
      </header>

      <!-- 탭 내비게이션 -->
      <nav class="tab-nav">
        <div id="tab-tasks" class="tab-item active">할 일 📝</div>
        <div id="tab-routines" class="tab-item">매일 루틴 💊</div>
        <div id="tab-chats" class="tab-item">응원 한마디 💕</div>
      </nav>

      <!-- 메인 컨텐츠 -->
      <main>
        <!-- 탭 1: 할 일 (Tasks) -->
        <section id="sec-tasks">
          <div class="task-section-title">
            <span>남은 할 일</span>
          </div>
          <div id="pending-task-list" class="task-list">
            <!-- 미완료 할 일 렌더링 -->
          </div>

          <div class="task-section-title" style="margin-top: 28px;">
            <span>완료한 일 ✨</span>
          </div>
          <div id="completed-task-list" class="task-list">
            <!-- 완료한 할 일 렌더링 -->
          </div>
        </section>

        <!-- 탭 2: 매일 루틴 (Routines) -->
        <section id="sec-routines" style="display: none;">
          <div class="task-section-title">
            <span>오늘의 건강 & 복용 루틴</span>
          </div>
          <div id="routine-list">
            <!-- 루틴 목록 렌더링 -->
          </div>
        </section>

        <!-- 탭 3: 응원 한마디 (Chats) -->
        <section id="sec-chats" style="display: none;">
          <div id="chat-container" class="chat-container">
            <!-- 채팅 목록 렌더링 -->
          </div>

          <div class="chat-input-wrap">
            <input type="text" id="chat-input" class="chat-input" placeholder="가족에게 따뜻한 응원을 전해보세요 💕" maxlength="100">
            <button id="btn-send-chat" class="chat-send-btn">전송</button>
          </div>
        </section>
      </main>

      <!-- 할 일 추가 플로팅 버튼 -->
      <button id="fab-add" class="fab-add" title="할 일 등록">+</button>

      <!-- 할 일 추가 바텀시트 모달 -->
      <div id="modal-add-task" class="modal-overlay">
        <div class="bottom-sheet">
          <div class="sheet-handle"></div>
          <div class="sheet-title">
            <span>새로운 할 일 등록 📝</span>
            <button id="btn-voice-stt" class="voice-stt-btn">🎙️ 음성 입력</button>
          </div>

          <div class="input-group">
            <label>할 일 내용</label>
            <input type="text" id="input-task-title" class="input-field" placeholder="예: 비타민 챙겨먹기, 숙제하기">
          </div>

          <div class="input-group">
            <label>담당자</label>
            <input type="text" id="input-task-assignee" class="input-field" placeholder="이름 (예: 지민이, 온가족)">
          </div>

          <div class="input-group">
            <label>마감 날짜</label>
            <input type="date" id="input-task-date" class="input-field">
          </div>

          <!-- 알람 토글 스위치 -->
          <div class="switch-row">
            <div>
              <div style="font-weight: 700; font-size: 14px;">⏰ 특정 시각 알람 설정</div>
              <div style="font-size: 12px; color: #8E9AAF;">지정한 시간에 카드에 뱃지가 표시돼요</div>
            </div>
            <label class="switch">
              <input type="checkbox" id="chk-alarm">
              <span class="slider"></span>
            </label>
          </div>

          <div id="alarm-time-row" class="input-group" style="display: none; margin-top: 10px;">
            <label>알람 시각</label>
            <input type="time" id="input-alarm-time" class="input-field" value="10:00">
          </div>

          <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button id="btn-close-modal" class="btn-secondary" style="margin-top:0; flex:1;">취소</button>
            <button id="btn-save-task" class="btn-primary" style="flex:2;">등록 완료 🌸</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 스크립트 -->
  <script src="/static/js/todak-mobile.js"></script>
</body>
</html>
